name: Actualizar sitio diariamente

on:
  schedule:
    # 13:00 UTC = 09:00 CLT (UTC-4, horario de invierno Chile)
    # En verano chileno (UTC-3) dispara a las 10:00 — ajustar a 12:00 UTC si se desea
    - cron: '0 13 * * *'
  workflow_dispatch: # permite ejecutar manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar actualizar.js
        run: node actualizar.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html logs/
          git diff --cached --quiet && echo "Sin cambios" || (
            git commit -m "chore: actualización automática $(date +'%d/%m/%Y %H:%M') UTC" &&
            git push
          )
